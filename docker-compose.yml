name: nexus-foundation

services:
  postgres:
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_dev}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexus_pg_data:/var/lib/postgresql/data
      - ./infrastructure/database/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres} -d ${POSTGRES_DB:-nexus_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_internal

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_internal

  rabbitmq:
    image: rabbitmq:4.0.7-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - nexus_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - nexus_internal

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - nexus_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nexus_internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-nexus_dev};Username=nexus_app;Password=${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}"
      ConnectionStrings__MigrationConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-nexus_dev};Username=nexus_migrator;Password=${POSTGRES_MIGRATOR_PASSWORD:?Set POSTGRES_MIGRATOR_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      Jwt__Issuer: ${JWT_ISSUER:-https://nexus-c.local}
      Jwt__Audience: ${JWT_AUDIENCE:-nexus-ecosystem}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY (min 64 chars)}
      RabbitMQ__Enabled: "true"
      RabbitMQ__HostName: "rabbitmq"
      RabbitMQ__UserName: ${RABBITMQ_USER:-nexus}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      ObjectStorage__Provider: "S3"
      ObjectStorage__ServiceUrl: "http://minio:9000"
      ObjectStorage__BucketName: ${S3_BUCKET:-nexus-files}
      ObjectStorage__AccessKey: ${S3_ACCESS_KEY}
      ObjectStorage__SecretKey: ${S3_SECRET_KEY}
      ObjectStorage__SigningSecret: ${OBJECT_STORAGE_SIGNING_SECRET:?Set OBJECT_STORAGE_SIGNING_SECRET}
      OpenApi__Enabled: ${OPENAPI_ENABLED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - nexus_internal

volumes:
  nexus_pg_data:
  nexus_redis_data:
  nexus_rabbitmq_data:
  nexus_minio_data:

networks:
  nexus_internal:
    driver: bridge
